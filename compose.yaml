name: smart-coffee-shop

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.docker}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
  OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
  OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-900}
  PAYMENT_BANK_ID: ${PAYMENT_BANK_ID:-}
  PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-}
  PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT:-}
  PAYMENT_BANK_HOLDER: ${PAYMENT_BANK_HOLDER:-}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffee_shop}
      POSTGRES_USER: ${POSTGRES_USER:-coffee_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [private]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [private]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks: [private]

  demo-seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    command: ["python", "-m", "app.demo_seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  postgres_data_v18:
