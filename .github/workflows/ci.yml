name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: coffee_test
          POSTGRES_PASSWORD: "${{ github.run_id }}-${{ github.run_attempt }}"
          POSTGRES_DB: coffee_shop_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee_test -d coffee_shop_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://coffee_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/coffee_shop_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://coffee_test:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/coffee_shop_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip install pip-audit==2.10.1
      - name: Audit runtime dependencies
        run: python -m pip_audit -r backend/requirements.lock
      - name: Migrate test database
        run: python -m alembic upgrade head
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Backend tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file docker.env.example config --quiet
      - name: Build and start stack
        run: docker compose --env-file docker.env.example up -d --build
      - name: Seed safe demo data
        run: docker compose --env-file docker.env.example --profile demo run --rm demo-seed
      - name: Smoke business flow
        env:
          API_BASE_URL: http://127.0.0.1:8000
          DEMO_ADMIN_PASSWORD: CHANGE_ME_DEMO_PASSWORD_12_CHARS_MINIMUM
        run: python scripts/smoke_demo.py
      - name: Verify backup can restore into an isolated database
        run: |
          docker compose --env-file docker.env.example exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /tmp/coffee-ci.backup'
          docker compose --env-file docker.env.example exec -T db sh -c 'createdb -U "$POSTGRES_USER" coffee_shop_restore_ci'
          docker compose --env-file docker.env.example exec -T db sh -c 'pg_restore -U "$POSTGRES_USER" -d coffee_shop_restore_ci --no-owner --no-privileges /tmp/coffee-ci.backup'
          docker compose --env-file docker.env.example exec -T db sh -c 'test "$(psql -U "$POSTGRES_USER" -d coffee_shop_restore_ci -Atc "SELECT version_num FROM alembic_version")" = "b9d1e3f5a7c2"'
      - name: Verify PostgreSQL volume across restart
        run: |
          docker compose --env-file docker.env.example restart db
          docker compose --env-file docker.env.example up -d --wait backend frontend
      - name: Read data after restart
        env:
          API_BASE_URL: http://127.0.0.1:8000
          DEMO_ADMIN_PASSWORD: CHANGE_ME_DEMO_PASSWORD_12_CHARS_MINIMUM
        run: python scripts/smoke_demo.py --read-only
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file docker.env.example logs --no-color
      - name: Stop stack without deleting the volume
        if: always()
        run: docker compose --env-file docker.env.example down
